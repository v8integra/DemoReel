chapter: Your first results

setup:
  - nav: Review List
  - wait: 0.5

scenes:
  - say: Here are your first results. Each job gets a score from zero to a hundred, and the best fits are marked as strong matches.
    steps:
      - wait: 0.5
      - zoom: { on: 'article.review-card >> nth=0', scale: 1.3 }

  - say: Each one has a short reason, and a heads up when something needs a closer look.
    steps:
      - wait: 2

  - say: Click details to see exactly why it fits, and where the gaps are.
    steps:
      - unzoom
      - click: 'article.review-card >> nth=0 >> button:has-text("Details")'
      - scroll: { by: 250, over: 'article.review-card >> nth=0' }
      - zoom: { on: 'article.review-card >> nth=0 >> ul >> nth=0', scale: 1.4 }
      - wait: 1.5

  - say: Open posting takes you to the job on the employer's site. That's where you apply.
    steps:
      - unzoom
      - hover: 'article.review-card >> nth=0 >> button:has-text("Open posting")'
      - wait: 1

  - say: Then come back and mark it applied, and it moves to your Tracker. Or decline it, or save it for later.
    steps:
      - hover: 'article.review-card >> nth=0 >> button:text-is("Applied")'
      - wait: 0.7
      - hover: 'article.review-card >> nth=0 >> button:text-is("Decline")'
      - wait: 0.5
      - hover: 'article.review-card >> nth=0 >> button:has-text("Save for later")'

  - say: Jobs with low scores are hidden. Tick show low scores to see everything the search found.
    steps:
      - scroll: -1500
      - click: 'main label:has-text("Show low scores")'
      - wait: 0.8
      - scroll: { by: 900, over: main }

  - card:
      image: ../assets/icon.png
      title: You're ready
      subtitle: Try Searcher Mode next, to run your searches on a schedule.
      cta: Get Job Explorer on the Microsoft Store
    say: That's it. You've gone from setup to your first list of jobs. Next, try Searcher Mode, to run your searches automatically. Thanks for watching.
    hold: 1.5
